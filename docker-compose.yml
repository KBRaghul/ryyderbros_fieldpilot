services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldpilot}
      POSTGRES_DB: ${POSTGRES_DB:-fieldpilot}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldpilot}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldpilot}:${POSTGRES_PASSWORD:-fieldpilot}@db:5432/${POSTGRES_DB:-fieldpilot}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./evals:/app/evals
    depends_on:
      db:
        condition: service_healthy
  ui:
    build: ./backend
    env_file: .env
    environment:
      PYTHONPATH: /app
    working_dir: /app
    command: streamlit run /frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
volumes:
  pgdata:
